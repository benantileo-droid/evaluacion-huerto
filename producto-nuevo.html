<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Panel administrador HuertoHogar</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <nav class="barra-nav">
      <a href="home.html" class="logo-sitio">
        <img src="../img/logo.svg" alt="Logo HuertoHogar">
        HuertoHogar Admin
      </a>
    </nav>
  </header>

  <div class="layout-admin">
    <aside class="menu-admin" id="menu-admin"></aside>

    <main class="contenido-admin">
      <div class="encabezado-admin">
        <h1>Productos</h1>
        <a href="producto-nuevo.html" class="btn btn-primario">+ Nuevo producto</a>
      </div>

      <div class="filtros-categoria" id="filtros-categoria-admin" style="margin-bottom:20px;">
        <button class="filtro-btn activo" data-categoria="todos">Todos</button>
        <button class="filtro-btn" data-categoria="Frutas Frescas">Frutas Frescas</button>
        <button class="filtro-btn" data-categoria="Verduras Orgánicas">Verduras Orgánicas</button>
        <button class="filtro-btn" data-categoria="Productos Orgánicos">Productos Orgánicos</button>
        <button class="filtro-btn" data-categoria="Productos Lácteos">Productos Lácteos</button>
      </div>

      <div class="tarjeta-admin">
        <table class="tabla-admin">
          <thead>
            <tr>
              <th></th>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla-productos"></tbody>
        </table>
        <p class="aviso-vacio-admin" id="aviso-sin-productos" style="display:none;">
          No hay productos que coincidan con este filtro.
        </p>
      </div>
    </main>
  </div>

  <script src="../main/usuarios.js"></script>
  <script src="../main/productos.js"></script>
  <script src="admin.js"></script>
  <script>
    let categoriaActivaAdmin = "todos";

    document.addEventListener("DOMContentLoaded", () => {
      const sesion = protegerRutaAdmin(ROLES_CON_ACCESO_ADMIN);
      if (!sesion) return;

      renderizarMenuAdmin(sesion, "productos");
      mostrarSaludoAdmin(sesion);

      pintarTablaProductos();

      document.querySelectorAll("#filtros-categoria-admin .filtro-btn").forEach((boton) => {
        boton.addEventListener("click", () => {
          document
            .querySelectorAll("#filtros-categoria-admin .filtro-btn")
            .forEach((b) => b.classList.remove("activo"));
          boton.classList.add("activo");
          categoriaActivaAdmin = boton.dataset.categoria;
          pintarTablaProductos();
        });
      });
    });

    function pintarTablaProductos() {
      let productos = obtenerProductos();
      if (categoriaActivaAdmin !== "todos") {
        productos = productos.filter((p) => p.categoria === categoriaActivaAdmin);
      }

      const cuerpo = document.getElementById("cuerpo-tabla-productos");
      const aviso = document.getElementById("aviso-sin-productos");
      cuerpo.innerHTML = "";

      if (productos.length === 0) {
        aviso.style.display = "block";
        return;
      }
      aviso.style.display = "none";

      productos.forEach((p) => {
        const stockBajo = p.stock <= p.stockCritico;
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td><img class="miniatura-producto-tabla" src="${p.imagen}" alt="${p.nombre}"></td>
          <td>${p.id}</td>
          <td>${p.nombre}</td>
          <td><span class="etiqueta-categoria">${p.categoria}</span></td>
          <td>$${p.precio.toLocaleString("es-CL")} / ${p.unidad}</td>
          <td>
            ${p.stock}
            ${stockBajo ? `<br><span class="etiqueta-stock-critico">Stock crítico</span>` : ""}
          </td>
          <td class="acciones-tabla">
            <div class="fila-acciones">
              <a class="editar" href="producto-editar.html?id=${encodeURIComponent(p.id)}">Editar</a>
              <button class="eliminar" data-id="${p.id}">Eliminar</button>
            </div>
          </td>
        `;
        cuerpo.appendChild(fila);
      });

      cuerpo.querySelectorAll(".eliminar").forEach((boton) => {
        boton.addEventListener("click", () => {
          const id = boton.getAttribute("data-id");
          if (confirm("¿Eliminar este producto? Esta acción no se puede deshacer.")) {
            eliminarProducto(id);
            pintarTablaProductos();
          }
        });
      });
    }
  </script>
</body>
</html>
