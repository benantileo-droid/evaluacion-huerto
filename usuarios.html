<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo producto - Panel administrador HuertoHogar</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <nav class="barra-nav">
      <a href="home.html" class="logo-sitio">
        <img src="../img/logo.svg" alt="Logo HuertoHogar">
        HuertoHogar Admin
      </a>
    </nav>
  </header>

  <div class="layout-admin">
    <aside class="menu-admin" id="menu-admin"></aside>

    <main class="contenido-admin">
      <div class="encabezado-admin">
        <h1>Nuevo producto</h1>
        <a href="productos.html" class="btn btn-secundario">← Volver al listado</a>
      </div>

      <div class="tarjeta-formulario" style="max-width:640px; margin:0;">
        <div class="encabezado-form">Registro de producto</div>
        <div class="cuerpo-formulario">

          <form id="form-nuevo-producto" novalidate>

            <div class="campo">
              <label for="categoria">Categoría</label>
              <select id="categoria" name="categoria">
                <option value="">-- Seleccione la categoría --</option>
                <option value="Frutas Frescas">Frutas Frescas</option>
                <option value="Verduras Orgánicas">Verduras Orgánicas</option>
                <option value="Productos Orgánicos">Productos Orgánicos</option>
                <option value="Productos Lácteos">Productos Lácteos</option>
              </select>
              <p class="texto-ayuda">El código del producto (Ej: FR004) se genera automáticamente según la categoría.</p>
              <p class="mensaje-error"></p>
            </div>

            <div class="campo">
              <label for="nombre">Nombre del producto</label>
              <input type="text" id="nombre" name="nombre" maxlength="60" placeholder="Ej: Manzanas Fuji">
              <p class="mensaje-error"></p>
            </div>

            <div class="campo-doble">
              <div class="campo">
                <label for="precio">Precio (CLP)</label>
                <input type="number" id="precio" name="precio" min="1" placeholder="Ej: 1200">
                <p class="mensaje-error"></p>
              </div>
              <div class="campo">
                <label for="unidad">Unidad de venta</label>
                <input type="text" id="unidad" name="unidad" maxlength="30" placeholder="Ej: kilo, litro, bolsa 1kg">
                <p class="mensaje-error"></p>
              </div>
            </div>

            <div class="campo-doble">
              <div class="campo">
                <label for="stock">Stock disponible</label>
                <input type="number" id="stock" name="stock" min="0" placeholder="Ej: 100">
                <p class="mensaje-error"></p>
              </div>
              <div class="campo">
                <label for="stock-critico">Stock crítico</label>
                <input type="number" id="stock-critico" name="stock-critico" min="0" placeholder="Ej: 15">
                <p class="texto-ayuda">Bajo esta cantidad se mostrará la alerta de stock crítico.</p>
                <p class="mensaje-error"></p>
              </div>
            </div>

            <div class="campo">
              <label for="imagen">Imagen del producto</label>
              <div class="selector-imagen-producto">
                <select id="imagen" name="imagen"></select>
                <img id="vista-previa-imagen" class="vista-previa-imagen-producto" src="" alt="Vista previa">
              </div>
              <p class="texto-ayuda">O sube una foto propia desde tu computador (reemplaza la selección de arriba):</p>
              <input type="file" id="imagen-archivo" name="imagen-archivo" accept="image/*">
              <p class="mensaje-error" id="error-imagen-archivo"></p>
            </div>

            <div class="campo">
              <label for="descripcion">Descripción</label>
              <textarea id="descripcion" name="descripcion" maxlength="400" placeholder="Describe el producto..."></textarea>
              <p class="mensaje-error"></p>
            </div>

            <button type="submit" class="btn btn-primario btn-bloque">Registrar producto</button>

            <p id="mensaje-exito-producto" class="mensaje-confirmacion"></p>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../main/usuarios.js"></script>
  <script src="../main/productos.js"></script>
  <script src="../main/validaciones-base.js"></script>
  <script src="admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sesion = protegerRutaAdmin(ROLES_CON_ACCESO_ADMIN);
      if (!sesion) return;

      renderizarMenuAdmin(sesion, "productos");
      mostrarSaludoAdmin(sesion);

      const selectImagen = document.getElementById("imagen");
      const vistaPrevia = document.getElementById("vista-previa-imagen");
      const inputArchivo = document.getElementById("imagen-archivo");
      let imagenSeleccionada = "";

      IMAGENES_PRODUCTO.forEach((img) => {
        const opcion = document.createElement("option");
        opcion.value = img.valor;
        opcion.textContent = img.texto;
        selectImagen.appendChild(opcion);
      });
      selectImagen.value = IMAGENES_PRODUCTO[0].valor;
      imagenSeleccionada = selectImagen.value;
      vistaPrevia.src = imagenSeleccionada;

      selectImagen.addEventListener("change", () => {
        inputArchivo.value = "";
        imagenSeleccionada = selectImagen.value;
        vistaPrevia.src = imagenSeleccionada;
      });

      inputArchivo.addEventListener("change", () => {
        const archivo = inputArchivo.files[0];
        const errorArchivo = document.getElementById("error-imagen-archivo");
        errorArchivo.textContent = "";
        if (!archivo) return;

        if (!archivo.type.startsWith("image/")) {
          errorArchivo.textContent = "El archivo debe ser una imagen (jpg, png, webp, etc.).";
          inputArchivo.value = "";
          return;
        }
        if (archivo.size > 1 * 1024 * 1024) {
          errorArchivo.textContent = "La imagen no puede superar 1 MB (para no llenar el almacenamiento del navegador).";
          inputArchivo.value = "";
          return;
        }

        const lector = new FileReader();
        lector.onload = () => {
          imagenSeleccionada = lector.result;
          vistaPrevia.src = imagenSeleccionada;
        };
        lector.readAsDataURL(archivo);
      });

      const form = document.getElementById("form-nuevo-producto");

      const reglas = {
        categoria: [{ test: (v) => v.length > 0, mensaje: "Selecciona una categoría." }],
        nombre: [
          { test: (v) => v.length > 0, mensaje: "El nombre es obligatorio." },
          { test: (v) => v.length <= 60, mensaje: "El nombre no puede superar los 60 caracteres." },
        ],
        precio: [
          { test: (v) => v.length > 0, mensaje: "El precio es obligatorio." },
          { test: (v) => Number(v) > 0, mensaje: "El precio debe ser mayor a 0." },
        ],
        unidad: [
          { test: (v) => v.length > 0, mensaje: "La unidad de venta es obligatoria." },
          { test: (v) => v.length <= 30, mensaje: "La unidad no puede superar los 30 caracteres." },
        ],
        stock: [
          { test: (v) => v.length > 0, mensaje: "El stock es obligatorio." },
          { test: (v) => Number(v) >= 0, mensaje: "El stock no puede ser negativo." },
        ],
        "stock-critico": [
          { test: (v) => v.length > 0, mensaje: "El stock crítico es obligatorio." },
          { test: (v) => Number(v) >= 0, mensaje: "El stock crítico no puede ser negativo." },
        ],
        descripcion: [
          { test: (v) => v.length > 0, mensaje: "La descripción es obligatoria." },
          { test: (v) => v.length <= 400, mensaje: "La descripción no puede superar los 400 caracteres." },
        ],
      };

      Object.keys(reglas).forEach((id) => {
        const input = document.getElementById(id);
        if (input) {
          input.addEventListener("blur", () => validarCampo(id, reglas[id]));
          input.addEventListener("input", () => {
            if (input.closest(".campo").classList.contains("invalido")) {
              validarCampo(id, reglas[id]);
            }
          });
        }
      });

      form.addEventListener("submit", (evento) => {
        evento.preventDefault();
        let esValido = true;
        Object.keys(reglas).forEach((id) => {
          if (!validarCampo(id, reglas[id])) esValido = false;
        });

        const mensajeExito = document.getElementById("mensaje-exito-producto");
        if (esValido) {
          crearProducto({
            categoria: document.getElementById("categoria").value,
            nombre: document.getElementById("nombre").value.trim(),
            precio: document.getElementById("precio").value,
            unidad: document.getElementById("unidad").value.trim(),
            stock: document.getElementById("stock").value,
            stockCritico: document.getElementById("stock-critico").value,
            imagen: imagenSeleccionada,
            descripcion: document.getElementById("descripcion").value.trim(),
          });

          mensajeExito.style.display = "block";
          mensajeExito.textContent = "¡Producto creado correctamente! Redirigiendo al listado...";
          setTimeout(() => {
            window.location.href = "productos.html";
          }, 1200);
        } else {
          mensajeExito.style.display = "none";
          const primerError = form.querySelector(".campo.invalido");
          if (primerError) primerError.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
    });
  </script>
</body>
</html>
